- name: Read hotkey file
  ansible.builtin.slurp:
    src: "{{ hotkey_path }}"
  delegate_to: localhost
  become: false
  register: hotkey_content
  no_log: true

# Older hotkeys store a 32-byte secretSeed; newer bittensor-wallet hotkeys only store
# the 64-byte privateKey. Prefer the seed when present so existing deployments are unchanged.
- name: Extract credentials
  vars:
    hotkey_json: "{{ hotkey_content.content | b64decode | from_json }}"
  ansible.builtin.set_fact:
    miner_credentials:
      ss58_address: "{{ hotkey_json.ss58Address }}"
      secret_seed: "{{ hotkey_json.secretSeed | default('') | regex_replace('^0x', '') }}"
      private_key: "{{ '' if hotkey_json.secretSeed | default('') else (hotkey_json.privateKey | default('') | regex_replace('^0x', '')) }}"
  no_log: true

- name: Verify hotkey contains a secret seed or private key
  ansible.builtin.assert:
    that: miner_credentials.secret_seed or miner_credentials.private_key
    fail_msg: "Hotkey file {{ hotkey_path }} contains neither secretSeed nor privateKey"
    quiet: true
  no_log: true

- name: Distribute credentials to all cluster nodes
  ansible.builtin.set_fact:
    miner_ss58_address: "{{ miner_credentials.ss58_address }}"
    miner_secret_seed: "{{ miner_credentials.secret_seed }}"
    miner_private_key: "{{ miner_credentials.private_key }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['control'] + groups['workers'] }}"
  no_log: true
